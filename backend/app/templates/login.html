{% extends "base.html" %}

{% block title %}Iniciar Sesión - Recetario AI{% endblock %}

{% block content %}
<div class="row justify-content-center mt-5">
    <div class="col-md-5">
        <div class="card">
            <div class="card-header">
                <h3 class="card-title">🔐 Iniciar Sesión</h3>
            </div>
            <div class="card-body">


                <form action="/login" method="post">
                    <div class="mb-3">
                        <label for="username" class="form-label">📧 Email</label>
                        <input type="email" class="form-control" id="username" name="username" placeholder="tu@email.com" required>
                    </div>
                    <div class="mb-3">
                        <label for="password" class="form-label">🔑 Contraseña</label>
                        <input type="password" class="form-control" id="password" name="password" placeholder="••••••••" required>
                    </div>
                    <button type="submit" class="btn btn-primary w-100 mb-3">
                        ✨ Iniciar Sesión
                    </button>
                </form>

                <div class="text-center">
                    <p style="font-weight: 600; margin-bottom: 15px;">¿No tienes cuenta?</p>
                    <a href="/register" class="btn btn-success w-100">
                        ➕ Crear Cuenta Nueva
                    </a>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
